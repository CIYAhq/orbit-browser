appId: digital.ciya.orbit
productName: Orbit
copyright: Copyright © 2026 CIYA
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack: []
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # Chromium's licences, which the credits page links to (ST-17): electron-builder drops Electron's
  # copy from Mac apps, while Windows and Linux keep it beside the program.
  extraResources:
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  # Ad-hoc signature (no certificate): arm64 macOS refuses unsigned modified bundles as "damaged".
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: Web site URL
        CFBundleURLSchemes: [http, https]
    CFBundleDocumentTypes:
      - CFBundleTypeName: HTML document
        CFBundleTypeRole: Viewer
        LSItemContentTypes: [public.html]
    NSCameraUsageDescription: Websites you visit can ask to use your camera.
    NSMicrophoneUsageDescription: Websites you visit can ask to use your microphone.
dmg:
  sign: false
win:
  # Orbit can open the computer's PDF files (DL-13, ST-03): the installer registers it for .pdf under
  # the class Orbit.PDF, and Settings → General sends the user to Windows' Default apps to choose it
  # (src/main/settings/pdf-app.ts). Unverified: no Windows build is tested.
  fileAssociations:
    - ext: pdf
      name: Orbit.PDF
      description: PDF document
linux:
  target: [dir]
  category: Network
  icon: build/icon.png
  # For the launcher entry Orbit writes for itself (MW-14) and the tray button (MW-13).
  extraResources:
    - from: build/icon.png
      to: icon.png
npmRebuild: false
publish: null
